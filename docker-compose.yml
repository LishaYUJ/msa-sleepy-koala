services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: Data Source=/app/data/sleepykoala.db
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in the root .env file before starting Docker Compose}
      Jwt__Issuer: SleepyKoalaApi
      Jwt__Audience: SleepyKoalaClient
      Cors__AllowedOrigins__0: http://localhost:3000
    volumes:
      - sleepykoala-data:/app/data
    expose:
      - "8080"
    ports:
      - "5125:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  sleepykoala-data:
